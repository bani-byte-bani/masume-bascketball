<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>マス目バスケ</title>
<style>
:root{
  --navy:#14243F; --red:#C62A24; --blue:#17549E; --green:#1E8A4C;
  --wood:#F2E3C8; --wood2:#D6B884; --wood3:#E9D5AC; --line:#D9C39C;
  --ink:#15181C; --sub:#5A616B; --orange:#E88A1A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:#EEF0F3;color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  font-feature-settings:"palt";
}
.wrap{max-width:520px;margin:0 auto;padding:10px 10px 28px}

/* スコアボード */
.board{background:var(--navy);color:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.scores{display:flex;align-items:center;justify-content:space-between}
.team{display:flex;align-items:center;gap:8px}
.dot{width:14px;height:14px;border-radius:50%}
.dot.r{background:var(--red)}.dot.b{background:var(--blue)}
.tname{font-size:12px;color:#A9BBD6;letter-spacing:.06em}
.pts{font-size:30px;font-weight:800;line-height:1}
.adots{display:flex;gap:4px;margin-top:4px}
.adots.right{justify-content:flex-end}
.adot{width:7px;height:7px;border-radius:50%;border:1.4px solid rgba(255,255,255,.45)}
.adot.done{background:#fff;border-color:#fff}
.clock{text-align:center}
.clock .t{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.clock .lb{font-size:10px;color:#A9BBD6;letter-spacing:.1em;margin-top:2px}
.atkbar{margin-top:8px;display:flex;align-items:center;gap:8px;font-size:12px;color:#C3D2E8}
.pips{display:flex;gap:3px;flex:1}
.pip{flex:1;height:6px;border-radius:2px;background:#2E4470;min-width:2px}
.pip.used{background:#5A7BAE}
.pip.warn{background:#FF8A82}

/* ステータス */
.status{background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.turn{font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;justify-content:center;
  width:26px;height:26px;border-radius:50%;color:#fff;font-size:14px;font-weight:800}
.hint{font-size:13px;color:var(--sub);margin-top:4px;min-height:19px}

/* コート */
.courtbox{background:#fff;border-radius:12px;padding:10px;margin-bottom:8px}
.goal{background:var(--navy);color:#fff;font-size:11px;font-weight:800;letter-spacing:.16em;
  text-align:center;padding:4px 0;border-radius:6px 6px 0 0;width:calc(100%/5);margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(5,1fr);border:2px solid var(--navy);
  border-radius:0 0 4px 4px;overflow:hidden}
.cell{aspect-ratio:1/1;background:var(--wood);border:1px solid var(--line);
  position:relative;display:flex;align-items:center;justify-content:center;cursor:default}
.cell.z2{background:var(--wood2)}
.cell.z3{background:var(--wood3)}
.cell.sa-t{box-shadow:inset 0 3px 0 var(--navy)}
.cell.sa-b{box-shadow:inset 0 -3px 0 var(--navy)}
.cell.sa-l{box-shadow:inset 3px 0 0 var(--navy)}
.cell.sa-r{box-shadow:inset -3px 0 0 var(--navy)}
.cell.sa-tl{box-shadow:inset 3px 0 0 var(--navy),inset 0 3px 0 var(--navy)}
.cell.sa-tr{box-shadow:inset -3px 0 0 var(--navy),inset 0 3px 0 var(--navy)}
.cell.sa-bl{box-shadow:inset 3px 0 0 var(--navy),inset 0 -3px 0 var(--navy)}
.cell.sa-br{box-shadow:inset -3px 0 0 var(--navy),inset 0 -3px 0 var(--navy)}
.cell.opt{cursor:pointer;background:#CDEBD8}
.cell.opt::after{content:"";position:absolute;width:26%;height:26%;border-radius:50%;
  background:var(--green);opacity:.6}
.cell.opt2{cursor:pointer;background:#E4F3EA}
.cell.opt2::after{content:"";position:absolute;width:26%;height:26%;border-radius:50%;
  border:2px solid var(--green);opacity:.5}
.cell.ptarget{cursor:pointer;outline:3px solid var(--orange);outline-offset:-3px}
.cell.turncell{box-shadow:inset 0 0 0 3px #FFD54A;background:#FFF6DA}
.p{width:74%;height:74%;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:800;font-size:clamp(11px,3.4vw,16px);border:2px solid #fff;position:relative}
.p.r{background:var(--red)} .p.b{background:var(--blue)}
.p.act{
  box-shadow:0 0 0 4px #FFD54A, 0 0 12px 3px rgba(255,183,0,.8);
  transform:scale(1.14);
  z-index:2;
  animation:actpulse 1.1s ease-in-out infinite;
}
.p.act::after{
  content:"";position:absolute;left:50%;top:-15px;transform:translateX(-50%);
  width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;
  border-top:9px solid #FFB700;
  animation:actbounce 1.1s ease-in-out infinite;
}
@keyframes actpulse{
  0%,100%{ box-shadow:0 0 0 4px #FFD54A, 0 0 10px 2px rgba(255,183,0,.7); }
  50%{ box-shadow:0 0 0 6px #FFD54A, 0 0 16px 5px rgba(255,183,0,1); }
}
@keyframes actbounce{
  0%,100%{ top:-15px; } 50%{ top:-10px; }
}
.ball{position:absolute;top:-6px;right:-6px;width:50%;height:50%;
  filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.4))}
.ball svg{width:100%;height:100%;display:block}

/* ボタン */
.acts{display:flex;gap:8px;margin-bottom:8px}
button{font-family:inherit;font-weight:800;font-size:15px;border:none;border-radius:10px;
  padding:13px 10px;flex:1;cursor:pointer;color:#fff;background:var(--navy)}
button.pass{background:var(--orange)}
button.shoot{background:var(--green)}
button.ghost{background:#fff;color:var(--sub);border:1.5px solid #D3D7DD}
button:disabled{opacity:.32;cursor:not-allowed}
button:active{transform:translateY(1px)}

.log{background:#fff;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.6;
  max-height:150px;overflow-y:auto}
.log div{padding:2px 0;border-bottom:1px solid #F0F1F3;color:var(--sub)}
.log div:first-child{color:var(--ink);font-weight:700}
.log .sc{color:var(--green);font-weight:800}
.log .to{color:var(--red);font-weight:800}

.foot{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.setgroup{display:flex;align-items:center;gap:8px;background:#fff;border-radius:10px;padding:7px 10px}
.setlabel{font-size:12px;color:var(--sub);font-weight:800;width:34px;flex-shrink:0}
.radiorow{display:flex;gap:6px;flex:1}
.radiopill{flex:1;padding:8px 4px;font-size:13px;font-weight:700;border-radius:8px;
  border:1.5px solid #D3D7DD;background:#fff;color:var(--sub)}
.radiopill.on{background:var(--navy);color:#fff;border-color:var(--navy)}
#btnReset{width:100%}
.updated{text-align:center;font-size:11px;color:#9AA0A8;margin-top:10px;padding-bottom:4px}

/* モーダル */
.mask{position:fixed;inset:0;background:rgba(20,36,63,.75);display:none;
  align-items:center;justify-content:center;padding:24px;z-index:9}
.mask.on{display:flex}
.modal{background:#fff;border-radius:16px;padding:22px;max-width:340px;width:100%;text-align:center}
.modal h2{margin:0 0 8px;font-size:22px}
.modal p{margin:0 0 16px;font-size:15px;color:var(--sub);line-height:1.7}
.jan{font-size:44px;margin:6px 0 10px}
.jan.spin{animation:janspin .12s linear infinite}
@keyframes janspin{0%{transform:rotate(0deg) scale(1)}50%{transform:rotate(180deg) scale(1.18)}100%{transform:rotate(360deg) scale(1)}}
</style>
</head>
<body>
<div class="wrap">

  <div class="board">
    <div class="scores">
      <div class="team"><span class="dot r"></span><div><div class="tname">あか</div><div class="pts" id="scA">0</div><div class="adots" id="adotsA"></div></div></div>
      <div class="clock"><div class="t" id="attackNo">1</div><div class="lb">こうげき / 6</div></div>
      <div class="team"><div style="text-align:right"><div class="tname">あお</div><div class="pts" id="scB">0</div><div class="adots right" id="adotsB"></div></div><span class="dot b"></span></div>
    </div>
    <div class="atkbar">
      <span id="atkLabel">あかの攻撃</span>
      <div class="pips" id="pips"></div>
      <span id="left">あと10手</span>
    </div>
  </div>

  <div class="status">
    <div class="turn" id="turn"></div>
    <div class="hint" id="hint"></div>
  </div>

  <div class="courtbox">
    <div class="goal" id="goal">ゴール</div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="acts" id="moveActs">
    <button class="ghost" id="btnStay">その場にとどまる</button>
  </div>
  <div class="acts">
    <button class="pass" id="btnPass">パス</button>
    <button class="shoot" id="btnShoot">シュート</button>
    <button class="ghost" id="btnSkip">なにもしない</button>
  </div>

  <div class="log" id="log"></div>

  <div class="foot">
    <div class="setgroup">
      <span class="setlabel">青</span>
      <div class="radiorow" id="radioCpu">
        <button class="radiopill" data-val="manual">手動</button>
        <button class="radiopill" data-val="cpu">CPU</button>
      </div>
    </div>
    <div class="setgroup">
      <span class="setlabel">歩数</span>
      <div class="radiorow" id="radioSteps">
        <button class="radiopill" data-val="1">1歩ずつ</button>
        <button class="radiopill" data-val="2">2歩まで</button>
      </div>
    </div>
    <div class="setgroup">
      <span class="setlabel">人数</span>
      <div class="radiorow" id="radioMode">
        <button class="radiopill" data-val="3">3on3</button>
        <button class="radiopill" data-val="5">5on5</button>
      </div>
    </div>
    <button class="ghost" id="btnReset">最初から</button>
  </div>

  <div class="updated">修正日時：2026年8月17日 16:05（JST）</div>
</div>

<div class="mask" id="mask"><div class="modal">
  <div class="jan" id="mIcon">✊</div>
  <h2 id="mTitle"></h2>
  <p id="mBody"></p>
  <button id="mBtn">つづける</button>
</div></div>

<script>
// モード切替（3on3 / 5on5）
let N=3, COLS=5, ROWS=5, SA_C=[2,4], SA_R=[3,5], SHOT_CLOCK=9;
function setMode(n){
  N=n;
  if(n===3){ COLS=5; SA_C=[2,4]; } else { COLS=7; SA_C=[3,5]; }
  ROWS=5; SA_R=[3,5]; SHOT_CLOCK=n*3;   // 背番号3周
  document.getElementById('grid').style.gridTemplateColumns='repeat('+COLS+',1fr)';
  document.getElementById('goal').style.width='calc(100%/'+COLS+')';
}

let S;
const TOTAL_ATTACKS = 6;   // 赤・青ともに3回ずつ＝合計6攻撃で1ゲーム
// 初期陣形。ゴールはつねに上（r=ROWS側）なので、攻撃側・守備側の役割で振り分ける。
// 攻撃はまん中の背番号がトップでボールを持ち、残りは左右に開く。守備は各自1行ゴール側でマンツーマン。
function formations(){
  const mid=Math.ceil(N/2);
  if(N===3){
    return {
      atk:{1:{r:1,c:1}, 2:{r:1,c:3}, 3:{r:1,c:5}},
      def:{1:{r:2,c:1}, 2:{r:2,c:3}, 3:{r:2,c:5}},
      mid:mid
    };
  }
  // 5on5（7列）
  return {
    atk:{1:{r:2,c:1}, 2:{r:2,c:3}, 3:{r:1,c:4}, 4:{r:2,c:5}, 5:{r:2,c:7}},
    def:{1:{r:3,c:1}, 2:{r:3,c:3}, 3:{r:2,c:4}, 4:{r:3,c:5}, 5:{r:3,c:7}},
    mid:mid
  };
}
function initState(atk){
  const A=atk||'A', D=(A==='A')?'B':'A';
  const F=formations();
  const ps=[];
  for(let i=1;i<=N;i++){
    ps.push({id:A+i,team:A,num:i,r:F.atk[i].r,c:F.atk[i].c});
    ps.push({id:D+i,team:D,num:i,r:F.def[i].r,c:F.def[i].c});
  }
  return {
    pieces:ps, atk:A,
    ball:(A+F.mid),
    num:1, moves:0, phase:'ATK', passed:false,
    scoreA:0, scoreB:0, sel:null, log:[],
    attackNo:1, gameOver:false
  };
}
function newPossession(atk,reason){
  const a=S.scoreA, b=S.scoreB, lg=S.log, finished=S.attackNo;
  if(finished>=TOTAL_ATTACKS){
    if(reason) say(reason,'to');
    S.gameOver=true;
    endGame();
    return;
  }
  S=initState(atk);
  S.scoreA=a; S.scoreB=b; S.log=lg; S.attackNo=finished+1;
  if(reason) say(reason,'to');
  const teamNo=Math.ceil(S.attackNo/2);
  say((atk==='A'?'あか':'あお')+'の'+teamNo+'回目の攻撃'+(teamNo===3?'（ラスト！）':'')+'。全員スタートの位置へ。');
  render();
}
function endGame(){
  const w=S.scoreA>S.scoreB?'あかの勝ち！':S.scoreB>S.scoreA?'あおの勝ち！':'同点！';
  say('3回ずつの攻撃が終わりました。','to');
  modal('🏆','ぜんぶの攻撃おわり',S.scoreA+' - '+S.scoreB+'<br><b>'+w+'</b>',null);
  render();
}

const at=(r,c)=>S.pieces.find(p=>p.r===r&&p.c===c);
const byId=id=>S.pieces.find(p=>p.id===id);
const holder=()=>byId(S.ball);
const def=()=>S.atk==='A'?'B':'A';
const inSA=p=>p.c>=SA_C[0]&&p.c<=SA_C[1]&&p.r>=SA_R[0]&&p.r<=SA_R[1];
const cur=side=>S.pieces.find(p=>p.team===(side==='ATK'?S.atk:def())&&p.num===S.num);

let STEP2=false;   // true=ボールを持たない人は2歩まで / false=全員1歩
function steps(p){ return (STEP2 && p.id!==S.ball) ? 2 : 1; }
function legalMoves(p){
  const n=steps(p);
  const seen=new Set([p.r*10+p.c]);
  let frontier=[{r:p.r,c:p.c}], out=[];
  for(let s=0;s<n;s++){
    const next=[];
    for(const f of frontier){
      for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
        if(!dr&&!dc)continue;
        const r=f.r+dr,c=f.c+dc;
        if(r<1||r>ROWS||c<1||c>COLS)continue;
        if(at(r,c))continue;              // 人がいるマスは通れない・入れない
        if(seen.has(r*10+c))continue;
        seen.add(r*10+c); next.push({r,c}); out.push({r,c,d:s+1});
      }
    }
    frontier=next;
  }
  return out;
}
function passTargets(){
  const h=holder(); if(!h) return [];
  // パスを出せるのは「この手番で動いた選手」だけ（動いていない選手へのパスはなし）
  const mover=cur('ATK'); if(!mover) return [];
  if(mover.id===h.id) return [];        // 動いた本人がボールを持っているなら、パス先はいない
  return clearLine(h,mover) ? [mover] : [];
}
function clearLine(a,b){
  const dr=b.r-a.r, dc=b.c-a.c;
  if(!(dr===0||dc===0||Math.abs(dr)===Math.abs(dc)))return false;
  const n=Math.max(Math.abs(dr),Math.abs(dc));
  const sr=Math.sign(dr), sc=Math.sign(dc);
  for(let i=1;i<n;i++){
    const p=at(a.r+sr*i,a.c+sc*i);
    if(p&&p.team!==a.team)return false;   // 相手がいたらカット
  }
  return true;
}
// ブロックできる守備の位置：ボール保持者のゴール側3マス＋真横2マス（後ろは数えない）
function isBlockCell(r,c,p){
  if(r===p.r+1&&Math.abs(c-p.c)<=1) return true;   // ゴール側の3マス
  if(r===p.r&&Math.abs(c-p.c)===1) return true;    // 真横の2マス
  return false;
}
function adjDefenders(p){
  return S.pieces.filter(q=>q.team===def()&&isBlockCell(q.r,q.c,p));
}

/* ---------- CPU（青チーム） ---------- */
let cpuBlue=true, cpuScheduled=false;
const dist=(a,b)=>Math.max(Math.abs(a.r-b.r),Math.abs(a.c-b.c));
function goalPos(){ return {r:ROWS+1,c:Math.ceil(COLS/2)}; }
// CPUの基本方針：相手プレイヤーよりゴール側（＝rが大きいほう）のマスへ入る。
// 守備なら相手の前に立ちふさがり、攻撃なら守備を抜き去る形になる。
const GOAL_SIDE=10;                 // ゴール側かどうかを最優先にするための重み
function goalSide(r,ref){           // ref よりゴール側なら+1／同じ行なら0／手前なら-1
  return r>ref.r ? 1 : (r===ref.r ? 0 : -1);
}
function atkCellScore(a,r,c){
  let s=-dist({r,c},goalPos())*3;
  // シュートはエリア内からしか打てないので、エリアに入ることを重くみる
  if(c>=SA_C[0]&&c<=SA_C[1]&&r>=SA_R[0]&&r<=SA_R[1]) s+=12;
  // 自分のマーク相手（同じ背番号の守備）よりゴール側に出るのが基本
  const mark=S.pieces.find(q=>q.team===def()&&q.num===a.num);
  if(mark) s+=goalSide(r,mark)*GOAL_SIDE;
  // ブロックされるマス（ゴール側3マス＋真横2マスに守備がいる）は、そのぶん減点
  const blockers=S.pieces.filter(q=>q.team===def()&&isBlockCell(q.r,q.c,{r,c})).length;
  s-=blockers*4;
  return s+Math.random()*0.6;   // 同点はランダムに散らす
}
function defCellScore(d,r,c){
  const bh=holder();
  const mark=S.pieces.find(p=>p.team===S.atk&&p.num===d.num);
  const target=(dist(d,bh)<=2)?bh:mark;
  let s=-(dist({r,c},target)*2+dist({r,c},goalPos())*0.5);
  // ねらう相手よりゴール側に立つのが基本
  s+=goalSide(r,target)*GOAL_SIDE;
  // ブロックできる位置（ゴール側3マス＋真横2マス）に入れたら加点。ゴール側のほうを厚くみる
  if(isBlockCell(r,c,target)) s += (r===target.r+1) ? 5 : 3;
  return s+Math.random()*0.4;
}
function isCPUTurn(){
  if(!cpuBlue) return false;
  if(S.gameOver) return false;
  if(document.getElementById('mask').classList.contains('on')) return false;
  if(S.phase==='ATK'||S.phase==='ACTION') return S.atk==='B';
  if(S.phase==='DEF') return def()==='B';
  return false;
}
function cpuMove(){
  const isAtk=S.phase==='ATK';
  const mover=isAtk?cur('ATK'):cur('DEF');
  if(!mover) return;
  const cand=legalMoves(mover).map(o=>({r:o.r,c:o.c}));
  cand.push({r:mover.r,c:mover.c});   // その場にとどまる、もCPUの選択肢
  const scoreFn=isAtk?(c)=>atkCellScore(mover,c.r,c.c):(c)=>defCellScore(mover,c.r,c.c);
  let best=cand[0], bs=scoreFn(best);
  for(const cd of cand){ const s=scoreFn(cd); if(s>bs){bs=s;best=cd;} }
  const stayed=(best.r===mover.r&&best.c===mover.c);
  mover.r=best.r; mover.c=best.c;
  say('あお'+mover.num+'番が'+(stayed?'その場にとどまった。':'動いた。'));
  if(isAtk){ S.moves++; afterAtkMove(); } else { afterDefMove(); }
}
function cpuAction(){
  const targets=passTargets();   // 「動いた選手」への1本だけ（0人か1人）
  const firstLap = S.moves <= N; // 1周目はまだ狙わず、まわして様子を見る
  if(!S.passed){
    // まだパスを受けていない＝打てない。出せるなら必ずパスする
    if(targets.length){
      const t=targets[0];
      S.ball=t.id; S.sel=null; S.passed=true;
      say('あお、'+t.num+'番へパス。');
      render(); return;
    }
    say('あお：パスできる相手がいないので、なにもしない。');
    endAction(); return;
  }
  if(!inSA(holder())){
    say('あお：まだエリアの外なので打てない。なにもしない。');
    endAction(); return;
  }
  if(firstLap){
    say('あお：1周目はまだ様子見。なにもしない。');
    endAction(); return;
  }
  say('あおがシュートを狙う。'); doShoot(); return;
}
function maybeCPU(){
  if(!isCPUTurn()||cpuScheduled) return;
  cpuScheduled=true;
  setTimeout(()=>{
    cpuScheduled=false;
    if(!isCPUTurn()) return;
    if(S.phase==='ACTION') cpuAction(); else cpuMove();
  },550);
}

/* ---------- 進行 ---------- */
function afterAtkMove(){ S.phase='ACTION'; S.passed=false; S.sel=null; render(); }
function endAction(){ S.phase='DEF'; S.sel=null; render(); }
function afterDefMove(){
  S.num = S.num===N?1:S.num+1;
  S.sel=null;
  if(S.moves>=SHOT_CLOCK){ newPossession(def(),SHOT_CLOCK+'手たってもシュートなし。相手ボール！'); return; }
  S.phase='ATK'; render();
}

function doShoot(){
  if(!S.passed){ say('パスを受けてからでないと打てません。'); return; }
  const h=holder();
  if(!inSA(h)){ say('エリアの外からは打てません。エリアの中まで運びましょう。'); return; }
  const n=adjDefenders(h).length;
  if(n===0){ say('ノーマーク！ そのままシュート。'); resolveShot(h); return; }
  say('ブロックが'+n+'人（ゴール側3マス＋真横2マス）。ぜんいんにジャンケンで勝てば打てます。');
  janChain(h,n,1);
}
function janChain(h,total,i){
  janModal('ジャンケン！ （'+i+' / '+total+'人目）',
    (total>1?'ブロックしている'+total+'人ぜんいんに勝たないと打てません。<br>':'')+(i)+'人目と勝負！',
    ()=>{ // 勝ち
      say(i+'人目に勝った！');
      if(i<total){ janChain(h,total,i+1); }
      else { say('全員に勝った！ シュート！'); resolveShot(h); }
    },
    ()=>{ // 負け
      newPossession(def(),(i)+'人目に負けた…。ブロック！ 相手ボール。');
    });
}
function resolveShot(h){
  const pts = (h.r>=4) ? 2 : 3;   // エリア内のゴールに近い2行が2点、エリア内の遠い1行が3点
  const team = S.atk;
  if(pts===2){
    diceModal('🏀 2点シュート！','サイコロで <b>3以下</b> なら成功（2分の1）。',
      (roll)=>roll<=3, ()=>madeShot(team,pts), missShot);
  } else {
    diceModal('🏀 3点シュート！','サイコロで <b>6</b> が出たら成功（6分の1）。',
      (roll)=>roll===6, ()=>madeShot(team,pts), missShot);
  }
}
function madeShot(team,pts){
  if(team==='A')S.scoreA+=pts; else S.scoreB+=pts;
  say((team==='A'?'あか':'あお')+'が '+pts+'点！','sc');
  newPossession(def());   // 得点したチームの相手に攻撃権が移る
}
function missShot(){
  say('シュートは外れた。リバウンド！');
  janModal('🏀 リバウンド','ゴールにいちばん近い2人で勝負！',
    ()=>{
      // 実際にリバウンドを取った人（ゴールに一番近い攻撃側）がボールを持つ
      const nearest = S.pieces.filter(p=>p.team===S.atk)
        .reduce((a,b)=>dist(b,goalPos())<dist(a,goalPos())?b:a);
      S.ball = nearest.id;
      say('攻撃側がリバウンドを取った！ '+nearest.num+'番がボール。そのまま続けられます。');
      // 取った本人の手番として、すぐシュートかパスを選べる状態にする
      S.moves=0; S.num=nearest.num; S.phase='ACTION'; S.passed=true; S.sel=null;
      render();
    },
    ()=>{ newPossession(def(),'守備がリバウンドを取った。相手ボール。'); }
  );
}

/* ---------- 描画 ---------- */
let guard=false;
function ensureMovable(){
  if(guard)return; guard=true;
  for(let i=0;i<20;i++){
    if(S.phase==='ATK'){
      const p=cur('ATK');
      if(p&&legalMoves(p).length===0){
        say('あかの'+S.num+'番は動けるマスがないので、この番はとばします。');
        S.moves++; S.phase='ACTION'; S.passed=false; continue;
      }
      break;
    }
    if(S.phase==='ACTION'){
      const canPass = passTargets().length>0;
      const canShoot = !!S.passed && inSA(holder());   // シュートはエリア内からだけ
      if(!canPass && !canShoot){
        say('パスもシュートもできないので、自動的に次の番へ。');
        S.phase='DEF'; S.sel=null; continue;
      }
      break;
    }
    if(S.phase==='DEF'){
      const p=cur('DEF');
      if(p&&legalMoves(p).length===0){
        say('守備の'+S.num+'番は動けるマスがないので、この番はとばします。');
        S.num = S.num===N?1:S.num+1;
        if(S.moves>=SHOT_CLOCK){ guard=false; newPossession(def(),SHOT_CLOCK+'手たってもシュートなし。相手ボール！'); return; }
        S.phase='ATK'; continue;
      }
      break;
    }
    break;
  }
  guard=false;
}

function render(){
  ensureMovable();

  document.getElementById('scA').textContent=S.scoreA;
  document.getElementById('scB').textContent=S.scoreB;
  document.getElementById('atkLabel').textContent=(S.atk==='A'?'あか':'あお')+'の攻撃';
  const rest=SHOT_CLOCK-S.moves;
  document.getElementById('left').textContent='あと'+rest+'手';
  const pips=document.getElementById('pips'); pips.innerHTML='';
  for(let i=0;i<SHOT_CLOCK;i++){
    const d=document.createElement('div');
    d.className='pip'+(i<S.moves?(rest<=5?' warn':' used'):'');
    pips.appendChild(d);
  }
  document.getElementById('attackNo').textContent=Math.min(S.attackNo,TOTAL_ATTACKS);
  const doneTotal = S.gameOver ? TOTAL_ATTACKS : S.attackNo-1;
  const doneA=Math.ceil(doneTotal/2), doneB=Math.floor(doneTotal/2);
  const dotsHtml=(done)=>{ let h=''; for(let i=0;i<3;i++) h+='<span class="adot'+(i<done?' done':'')+'"></span>'; return h; };
  document.getElementById('adotsA').innerHTML=dotsHtml(doneA);
  document.getElementById('adotsB').innerHTML=dotsHtml(doneB);

  const side = S.phase==='DEF'?'DEF':'ATK';
  const p = cur(side);
  const tm = side==='ATK'?S.atk:def();
  document.getElementById('turn').innerHTML =
    '<span class="chip" style="background:'+((S.phase==='ACTION'?S.atk:tm)==='A'?'var(--red)':'var(--blue)')+'">'+(S.phase==='ACTION'?holder().num:S.num)+'</span>'+
    (S.phase==='ACTION'
      ? (S.atk==='A'?'あか':'あお')+'の'+holder().num+'番がボール'
      : (tm==='A'?'あか':'あお')+'の'+S.num+'番が動く');
  const mv = STEP2 ? '●＝1歩　○＝2歩。ボールを持っている人は1歩だけ。' : 'みどりのマスをタップ。全員1歩だけ動けます。';
  const hints={ATK:mv,
               ACTION:S.passed
                 ? (inSA(holder())
                     ? 'パスを受けた'+holder().num+'番はそのまま打てます。'
                     : 'エリアの外なのでまだ打てません。色のついたエリアまで運びましょう。')
                 : 'パスを出せるのは、この手番で動いた選手だけ。シュートはパスを受けたあと、エリアの中からだけ。',
               DEF:mv};
  document.getElementById('hint').textContent =
    isCPUTurn() ? '青（CPU）が考え中…' : (hints[S.phase]||'');

  const g=document.getElementById('grid'); g.innerHTML='';
  const cpuTurn = isCPUTurn();
  const opts = (S.phase==='ACTION'||cpuTurn) ? [] : legalMoves(p);
  const ptg = (S.sel==='PASS'&&!cpuTurn) ? passTargets() : [];
  for(let r=ROWS;r>=1;r--)for(let c=1;c<=COLS;c++){
    const cell=document.createElement('div');
    let cls='cell';
    const sa = c>=SA_C[0]&&c<=SA_C[1]&&r>=SA_R[0]&&r<=SA_R[1];
    // 色がついているマス＝シュートできるエリア内。ゴールに近い2行が2点、残り1行が3点。
    if(sa) cls += (r>=4) ? ' z2' : ' z3';
    if(sa){
      const t=r===SA_R[1],b=r===SA_R[0],l=c===SA_C[0],ri=c===SA_C[1];
      if(t&&l)cls+=' sa-tl'; else if(t&&ri)cls+=' sa-tr';
      else if(b&&l)cls+=' sa-bl'; else if(b&&ri)cls+=' sa-br';
      else if(t)cls+=' sa-t'; else if(b)cls+=' sa-b';
      else if(l)cls+=' sa-l'; else if(ri)cls+=' sa-r';
    }
    const o1=opts.find(o=>o.r===r&&o.c===c);
    if(o1) cls+=(o1.d===1?' opt':' opt2');
    const pc=at(r,c);
    if(pc&&ptg.some(t=>t.id===pc.id)) cls+=' ptarget';
    const isActive = pc && p && pc.id===p.id && S.phase!=='ACTION';
    if(isActive) cls+=' turncell';
    cell.className=cls;
    if(pc){
      const el=document.createElement('div');
      el.className='p '+(pc.team==='A'?'r':'b')+(isActive?' act':'');
      el.textContent=pc.num;
      if(pc.id===S.ball){
        const b=document.createElement('div'); b.className='ball';
        b.innerHTML='<svg viewBox="0 0 100 100">'
          +'<circle cx="50" cy="50" r="44" fill="#D08759" stroke="#764A2A" stroke-width="10"/>'
          +'<line x1="50" y1="9" x2="50" y2="91" stroke="#764A2A" stroke-width="8"/>'
          +'<line x1="9" y1="50" x2="91" y2="50" stroke="#764A2A" stroke-width="8"/>'
          +'</svg>';
        el.appendChild(b);
      }
      cell.appendChild(el);
    }
    cell.onclick=()=>onCell(r,c);
    g.appendChild(cell);
  }

  document.getElementById('moveActs').style.display = (S.phase==='ACTION') ? 'none' : 'flex';
  const act=S.phase==='ACTION'&&!cpuTurn&&!S.gameOver;
  document.getElementById('btnPass').disabled = !act || passTargets().length===0;
  document.getElementById('btnShoot').disabled = !act || !holder() || !S.passed || !inSA(holder());
  document.getElementById('btnSkip').disabled = !act;
  document.getElementById('btnStay').disabled = cpuTurn || S.phase==='ACTION';
  document.getElementById('btnPass').textContent = S.sel==='PASS'?'パス（やめる）':'パス';

  const lg=document.getElementById('log');
  lg.innerHTML=S.log.slice(0,40).map(l=>'<div class="'+(l.k||'')+'">'+l.t+'</div>').join('');

  maybeCPU();
}

function onCell(r,c){
  if(isCPUTurn()||S.gameOver)return;
  if(S.phase!=='ACTION'){ S.sel=null; }   // 行動フェーズ以外ではパス選択そのものを無効化
  if(S.sel==='PASS' && S.phase==='ACTION'){
    const t=at(r,c);
    if(t&&passTargets().some(x=>x.id===t.id)){
      S.ball=t.id; S.sel=null; S.passed=true;
      const n=adjDefenders(t).length;
      const willPts=(t.r>=4)?2:3;
      say(t.num+'番へパス。'+(!inSA(t)
            ? 'まだエリアの外なので、ここからは打てません。'
            : (n===0?'ノーマークだ！ そのまま打てる（'+willPts+'点）。'
                   : 'ブロックが'+n+'人。ぜんいんに勝てば打てる（'+willPts+'点）。')));
      render();
    }
    return;
  }
  if(S.phase==='ACTION')return;
  const side=S.phase==='DEF'?'DEF':'ATK';
  const p=cur(side);
  if(!legalMoves(p).some(o=>o.r===r&&o.c===c))return;
  p.r=r;p.c=c;
  if(S.phase==='ATK'){ S.moves++; afterAtkMove(); }
  else { afterDefMove(); }
}

function say(t,k){ S.log.unshift({t:t,k:k}); }

/* ---------- モーダル ---------- */
let mCb=null, mStage='simple';
function modal(icon,title,body,cb){
  mStage='simple';
  document.getElementById('mIcon').className='jan';
  document.getElementById('mIcon').textContent=icon;
  document.getElementById('mTitle').textContent=title;
  document.getElementById('mBody').innerHTML=body;
  document.getElementById('mBtn').textContent='つづける';
  document.getElementById('mBtn').style.display='';
  document.getElementById('mask').classList.add('on');
  mCb=cb;
}
// 二分の一のランダムで勝敗を決める「ジャンケン」演出つきモーダル。
// ボタンを押す→ぐるぐる（演出）→Math.random()<0.5 で勝敗確定→結果表示→OKで先へ。
function janModal(title,body,onWin,onLose){
  mStage='ask';
  const icon=document.getElementById('mIcon');
  icon.className='jan';
  icon.textContent='✊';
  document.getElementById('mTitle').textContent=title;
  document.getElementById('mBody').innerHTML=body;
  document.getElementById('mBtn').textContent='ジャンケン ポン！';
  document.getElementById('mBtn').style.display='';
  document.getElementById('mask').classList.add('on');
  mCb=()=>{
    mStage='spin';
    icon.classList.add('spin');
    document.getElementById('mBtn').style.display='none';
    document.getElementById('mBody').innerHTML=body+'<br><span style="opacity:.55">ポポポン…</span>';
    setTimeout(()=>{
      icon.classList.remove('spin');
      const win=Math.random()<0.5;   // ← ここが二分の一のランダム
      icon.textContent=win?'🎉':'💥';
      document.getElementById('mBody').innerHTML=
        body+'<br><b style="color:'+(win?'#1E8A4C':'#C62A24')+'">'+(win?'勝った！':'負けた…')+'</b>';
      document.getElementById('mBtn').textContent='OK';
      document.getElementById('mBtn').style.display='';
      mStage='result';
      mCb=()=>{ (win?onWin:onLose)(); };
    },650);
  };
}
document.getElementById('mBtn').onclick=()=>{
  if(mStage==='ask'){ const f=mCb; if(f)f(); return; }  // 演出開始（モーダルは開いたまま）
  document.getElementById('mask').classList.remove('on');
  const f=mCb; mCb=null; if(f)f(); render();
};
// サイコロ（1〜6）を実際にふって成功/失敗を決める演出つきモーダル。
const DICE_FACE=['⚀','⚁','⚂','⚃','⚄','⚅'];
function diceModal(title,body,isSuccessFn,onSuccess,onFail){
  mStage='ask';
  const icon=document.getElementById('mIcon');
  icon.className='jan';
  icon.textContent='🎲';
  document.getElementById('mTitle').textContent=title;
  document.getElementById('mBody').innerHTML=body;
  document.getElementById('mBtn').textContent='サイコロを ふる！';
  document.getElementById('mBtn').style.display='';
  document.getElementById('mask').classList.add('on');
  mCb=()=>{
    mStage='spin';
    icon.classList.add('spin');
    document.getElementById('mBtn').style.display='none';
    document.getElementById('mBody').innerHTML=body+'<br><span style="opacity:.55">コロコロコロ…</span>';
    setTimeout(()=>{
      icon.classList.remove('spin');
      const roll=1+Math.floor(Math.random()*6);   // ← 実際の1〜6のランダム
      const ok=isSuccessFn(roll);
      icon.textContent=DICE_FACE[roll-1];
      document.getElementById('mBody').innerHTML=
        body+'<br>出た目：<b style="font-size:20px">'+roll+'</b><br>'+
        '<b style="color:'+(ok?'#1E8A4C':'#C62A24')+'">'+(ok?'入った！':'外れた…')+'</b>';
      document.getElementById('mBtn').textContent='OK';
      document.getElementById('mBtn').style.display='';
      mStage='result';
      mCb=()=>{ (ok?onSuccess:onFail)(roll); };
    },650);
  };
}

/* ---------- ボタン ---------- */
document.getElementById('btnPass').onclick=()=>{ if(isCPUTurn()||S.gameOver)return; S.sel=S.sel==='PASS'?null:'PASS'; render(); };
document.getElementById('btnShoot').onclick=()=>{ if(isCPUTurn()||S.gameOver)return; S.sel=null; doShoot(); render(); };
document.getElementById('btnSkip').onclick=()=>{ if(isCPUTurn()||S.gameOver)return; S.sel=null; endAction(); };
document.getElementById('btnReset').onclick=()=>{
  cpuScheduled=false;
  S=initState('A');
  say('ゲーム開始！ あかの1回目の攻撃。');
  paintRadios();
  render();
};
document.getElementById('btnStay').onclick=()=>{
  if(isCPUTurn()||S.gameOver)return;
  if(S.phase==='ATK'){ S.moves++; say((S.atk==='A'?'あか':'あお')+cur('ATK').num+'番はその場にとどまった。'); afterAtkMove(); }
  else if(S.phase==='DEF'){ say('守備'+cur('DEF').num+'番はその場にとどまった。'); afterDefMove(); }
};
function paintRadios(){
  document.querySelectorAll('#radioCpu .radiopill').forEach(b=>{
    b.classList.toggle('on', (b.dataset.val==='cpu')===cpuBlue);
  });
  document.querySelectorAll('#radioSteps .radiopill').forEach(b=>{
    b.classList.toggle('on', Number(b.dataset.val)===(STEP2?2:1));
  });
  document.querySelectorAll('#radioMode .radiopill').forEach(b=>{
    b.classList.toggle('on', Number(b.dataset.val)===N);
  });
}
document.querySelectorAll('#radioCpu .radiopill').forEach(b=>{
  b.onclick=()=>{
    const wantCpu=(b.dataset.val==='cpu');
    if(wantCpu===cpuBlue)return;
    cpuBlue=wantCpu;
    say(cpuBlue?'青チームをCPUにしました。あなたは、あか担当です。':'青チームを手動にもどしました。');
    paintRadios(); render();
  };
});
document.querySelectorAll('#radioSteps .radiopill').forEach(b=>{
  b.onclick=()=>{
    const want2=(Number(b.dataset.val)===2);
    if(want2===STEP2)return;
    STEP2=want2;
    say(STEP2?'ボールを持たない人は2歩まで動けます。':'全員1歩だけになりました。');
    paintRadios(); render();
  };
});
document.querySelectorAll('#radioMode .radiopill').forEach(b=>{
  b.onclick=()=>{
    const v=Number(b.dataset.val);
    if(v===N)return;
    setMode(v);
    S=initState('A'); say(v+'on'+v+'に切りかえました。');
    paintRadios(); render();
  };
});

/* ---------- 開始 ---------- */
setMode(3);
S=initState('A');
say('3on3でゲーム開始！ あかの1回目の攻撃。 青チームはCPUです。');
paintRadios();
render();
</script>
